<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Butterfly Garden - Prototype</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; touch-action: none; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }

  /* Khung màn hình cố định tỉ lệ dọc điện thoại 1080x1920, co lại vừa
     màn hình PC (letterbox) thay vì kéo giãn full width như trước. */
  #khung {
    position: relative;
    width: min(100vw, calc(100dvh * 1080 / 1920));
    height: min(100dvh, calc(100vw * 1920 / 1080));
    background: #f6efe0;
    overflow: hidden;
    box-shadow: 0 0 30px rgba(0,0,0,0.4);
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 16px; pointer-events: none;
    color: #5b4636; text-shadow: 0 1px 2px rgba(255,255,255,0.8);
    font-size: 15px; font-weight: 600;
  }
  #hud button { pointer-events: auto; }

  .nutTron {
    border: none; border-radius: 20px; padding: 8px 14px;
    background: rgba(255,255,255,0.85); color: #5b4636;
    font-size: 13px; font-weight: 600; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  .nutTron.dangChon { background: #d98e5b; color: #fff; }

  #thanhCongCu {
    position: absolute; bottom: 60px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 10px;
  }
  #thanhCongCu button { padding: 11px 18px; font-size: 14px; }
  #btnPhase { background: #6fa87c; color: #fff; }

  #levelSelect {
    position: absolute; bottom: 14px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 10px;
  }

  #thongBao {
    position: absolute; top: 46%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(255,255,255,0.92); padding: 18px 26px; border-radius: 16px;
    color: #5b4636; font-size: 18px; font-weight: 700; text-align: center;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2); display: none;
  }

  #goiY {
    position: absolute; top: 44px; left: 0; right: 0; text-align: center;
    color: #5b4636; font-size: 13px; font-weight: 600; pointer-events: none;
    text-shadow: 0 1px 2px rgba(255,255,255,0.8);
  }
</style>
</head>
<body>
<div id="khung">
  <canvas id="canvas"></canvas>
  <div id="hud">
    <div id="hudTrai">Thiết lập — Nét vẽ: 0</div>
    <button id="btnDebug" class="nutTron">🐞 Debug</button>
  </div>
  <div id="goiY">Vẽ đường trên màn hình để tạo luồng gió, rồi bấm Bắt đầu bay</div>
  <div id="thongBao"></div>
  <div id="thanhCongCu">
    <button id="btnXoa" class="nutTron">🗑 Xoá nét vẽ</button>
    <button id="btnPhase" class="nutTron">▶ Bắt đầu bay</button>
  </div>
  <div id="levelSelect">
    <button class="nutTron" data-level="1">Dễ</button>
    <button class="nutTron" data-level="2">Khó</button>
    <button class="nutTron" data-level="3">Siêu khó</button>
  </div>
</div>

<script>
/* ============================================================
   BUTTERFLY GARDEN - prototype test cơ chế (chưa polish visual)
   Kiến trúc vật lý: lưới ô vuông (grid) chứa vector gió, thay vì
   lực cộng dồn tự do như bản đầu. Toàn bộ hệ số tune ở HE_SO/GRID.
   ============================================================ */

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const khung = document.getElementById('khung');
const hudTrai = document.getElementById('hudTrai');
const thongBao = document.getElementById('thongBao');
const goiY = document.getElementById('goiY');
const btnDebug = document.getElementById('btnDebug');
const btnXoa = document.getElementById('btnXoa');
const btnPhase = document.getElementById('btnPhase');

// Toạ độ "logic" cố định — mọi vị trí trong game (zone, bướm, lưới gió)
// đều tính theo hệ 1080x1920 này, không phụ thuộc kích thước màn hình thật.
const LOGICAL_W = 1080, LOGICAL_H = 1920;

function chinhKichThuoc() {
  const dpr = window.devicePixelRatio || 1;
  const rect = khung.getBoundingClientRect();
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  const tiLe = rect.width / LOGICAL_W; // khung luôn giữ đúng tỉ lệ 1080:1920
  ctx.setTransform(tiLe * dpr, 0, 0, tiLe * dpr, 0, 0);
}
window.addEventListener('resize', chinhKichThuoc);
window.addEventListener('orientationchange', chinhKichThuoc);
chinhKichThuoc();

// ---------- Vector 2D: chỉ dùng {x,y} thường, có hàm hỗ trợ ----------
const V = {
  cong: (a, b) => ({ x: a.x + b.x, y: a.y + b.y }),
  tru: (a, b) => ({ x: a.x - b.x, y: a.y - b.y }),
  nhan: (a, k) => ({ x: a.x * k, y: a.y * k }),
  doDai: (a) => Math.hypot(a.x, a.y),
  chuanHoa: (a) => {
    const d = Math.hypot(a.x, a.y);
    return d < 1e-6 ? { x: 0, y: 0 } : { x: a.x / d, y: a.y / d };
  },
};

// ============================================================
// MÀU SẮC theo tên tiếng Việt không dấu để tránh rắc rối encoding
// ============================================================
const MAU = {
  cam: '#ff9a52',
  tim: '#a06cd5',
  hong: '#ff6f9c',
};

// ============================================================
// LƯỚI GIÓ (grid vector field)
// - luoiLevel : vector gió cài sẵn theo level (cố định, không đổi)
// - luoiNguoiChoi : vector gió do người chơi vẽ ở phase Thiết lập (cố định)
// - luoiChinh : kết quả TỔNG HỢP sau khi lan toả (diffuse) — ô nào không
//   cố định thì lấy trung bình 4 ô xung quanh, lặp nhiều vòng cho mượt.
// ============================================================
const GRID = { canh: 40, cols: LOGICAL_W / 40, rows: LOGICAL_H / 40 }; // 27 x 48
const soO = GRID.cols * GRID.rows;

function oIndex(cx, cy) { return cy * GRID.cols + cx; }
function oTuViTri(p) {
  const cx = Math.floor(p.x / GRID.canh), cy = Math.floor(p.y / GRID.canh);
  if (cx < 0 || cx >= GRID.cols || cy < 0 || cy >= GRID.rows) return null;
  return { cx, cy };
}

let luoiLevel, coDinhLevel, luoiNguoiChoi, coDinhNguoiChoi, luoiChinh;

function taoLuoiTrong() {
  luoiLevel = new Float32Array(soO * 2);
  coDinhLevel = new Uint8Array(soO);
  luoiNguoiChoi = new Float32Array(soO * 2);
  coDinhNguoiChoi = new Uint8Array(soO);
  luoiChinh = new Float32Array(soO * 2);
}
taoLuoiTrong();

// đặt 1 vùng chữ nhật (theo toạ độ logic px) thành gió cố định của level
function datGioLevel(x0, y0, x1, y1, huong) {
  const h = V.chuanHoa(huong);
  const c0 = oTuViTri({ x: x0, y: y0 }) || { cx: 0, cy: 0 };
  const c1 = oTuViTri({ x: x1 - 1, y: y1 - 1 }) || { cx: GRID.cols - 1, cy: GRID.rows - 1 };
  for (let cy = c0.cy; cy <= c1.cy; cy++) {
    for (let cx = c0.cx; cx <= c1.cx; cx++) {
      const i = oIndex(cx, cy);
      luoiLevel[i * 2] = h.x; luoiLevel[i * 2 + 1] = h.y;
      coDinhLevel[i] = 1;
    }
  }
}

// Jacobi relaxation: ô không cố định = trung bình 4 ô lân cận, lặp nhiều
// vòng để lan toả ra toàn lưới. Sau cùng chuẩn hoá mọi vector về độ dài 1
// (độ lớn gió tạm thời luôn = 1, để dành mở rộng sau).
const SO_VONG_LAN_TOA = 120;
function tinhLuoiChinh() {
  let a = new Float32Array(soO * 2);
  for (let i = 0; i < soO; i++) {
    if (coDinhNguoiChoi[i]) { a[i * 2] = luoiNguoiChoi[i * 2]; a[i * 2 + 1] = luoiNguoiChoi[i * 2 + 1]; }
    else if (coDinhLevel[i]) { a[i * 2] = luoiLevel[i * 2]; a[i * 2 + 1] = luoiLevel[i * 2 + 1]; }
  }
  let b = new Float32Array(soO * 2);

  for (let vong = 0; vong < SO_VONG_LAN_TOA; vong++) {
    for (let cy = 0; cy < GRID.rows; cy++) {
      for (let cx = 0; cx < GRID.cols; cx++) {
        const i = oIndex(cx, cy);
        if (coDinhNguoiChoi[i] || coDinhLevel[i]) {
          b[i * 2] = a[i * 2]; b[i * 2 + 1] = a[i * 2 + 1];
          continue;
        }
        let sx = 0, sy = 0, dem = 0;
        if (cx > 0) { const j = oIndex(cx - 1, cy); sx += a[j * 2]; sy += a[j * 2 + 1]; dem++; }
        if (cx < GRID.cols - 1) { const j = oIndex(cx + 1, cy); sx += a[j * 2]; sy += a[j * 2 + 1]; dem++; }
        if (cy > 0) { const j = oIndex(cx, cy - 1); sx += a[j * 2]; sy += a[j * 2 + 1]; dem++; }
        if (cy < GRID.rows - 1) { const j = oIndex(cx, cy + 1); sx += a[j * 2]; sy += a[j * 2 + 1]; dem++; }
        b[i * 2] = dem ? sx / dem : 0;
        b[i * 2 + 1] = dem ? sy / dem : 0;
      }
    }
    [a, b] = [b, a];
  }

  for (let i = 0; i < soO; i++) {
    const vx = a[i * 2], vy = a[i * 2 + 1];
    const d = Math.hypot(vx, vy);
    if (d < 1e-4) { luoiChinh[i * 2] = 0; luoiChinh[i * 2 + 1] = 0; }
    else { luoiChinh[i * 2] = vx / d; luoiChinh[i * 2 + 1] = vy / d; }
  }
}

// gió tại 1 vị trí bất kỳ (lấy theo ô chứa vị trí đó)
function gioTaiViTri(p) {
  const o = oTuViTri(p);
  if (!o) return { x: 0, y: 0 };
  const i = oIndex(o.cx, o.cy);
  return { x: luoiChinh[i * 2], y: luoiChinh[i * 2 + 1] };
}

// ============================================================
// CẤU HÌNH TỪNG LEVEL — zone theo toạ độ logic tuyệt đối (px trong 1080x1920)
// gioLevel: danh sách vùng gió cố định đặt sẵn, chỉ để tạo base field
// khác nhau cho từng level; người chơi vẽ thêm để dẫn dòng gió vào hoa.
// ============================================================
function taoZone(mau, x, y, r) { return { mau, x, y, r }; }

const CAU_HINH_LEVEL = {
  1: {
    ten: 'Dễ',
    dsButterflyMau: ['cam', 'cam', 'cam'],
    vungHoa: [taoZone('cam', 540, 1000, 190)],
    gioLevel: [{ x0: 0, y0: 120, x1: 1080, y1: 260, huong: { x: 0, y: 1 } }],
  },
  2: {
    ten: 'Khó',
    dsButterflyMau: ['cam', 'cam', 'tim', 'tim'],
    vungHoa: [taoZone('cam', 230, 380, 170), taoZone('tim', 850, 1540, 170)],
    gioLevel: [
      { x0: 0, y0: 0, x1: 160, y1: 1920, huong: { x: 1, y: 0.6 } },
      { x0: 920, y0: 0, x1: 1080, y1: 1920, huong: { x: -1, y: -0.6 } },
    ],
  },
  3: {
    ten: 'Siêu khó',
    dsButterflyMau: ['cam', 'cam', 'tim', 'tim', 'hong', 'hong'],
    vungHoa: [
      taoZone('cam', 260, 380, 150),
      taoZone('tim', 820, 380, 150),
      taoZone('hong', 540, 1620, 150),
    ],
    gioLevel: [
      { x0: 0, y0: 700, x1: 1080, y1: 800, huong: { x: 1, y: 0 } },
      { x0: 0, y0: 1100, x1: 1080, y1: 1200, huong: { x: -1, y: 0 } },
      { x0: 460, y0: 0, x1: 620, y1: 400, huong: { x: 0, y: 1 } },
    ],
  },
};

// ============================================================
// TRẠNG THÁI GAME
// ============================================================
const state = {
  level: 1,
  phase: 'setup', // 'setup' (vẽ đường) | 'play' (bướm bắt đầu bay theo gió)
  thoiGian: 0,
  soNetVe: 0,
  debug: false,
  buom: [],
};

const HE_SO = {
  tocDoBay: 220,         // (px logic/giây) tốc độ bay khi thuận theo luồng gió
  doNhayHuong: 3.2,      // vận tốc "bám" theo hướng gió mới nhanh hay chậm
  thoiGianDauDung: 1.2,  // (giây) đứng yên trong đúng vùng hoa để "đậu"
  thoiGianBayDi: 5,      // (giây) đứng trong vùng sai màu quá lâu thì bay mất
};

function viTriNgauNhienTranhVung(zones) {
  for (let thu = 0; thu < 20; thu++) {
    const p = { x: 80 + Math.random() * (LOGICAL_W - 160), y: 420 + Math.random() * (LOGICAL_H - 840) };
    if (zones.every(z => Math.hypot(p.x - z.x, p.y - z.y) > z.r + 60)) return p;
  }
  return { x: LOGICAL_W / 2, y: LOGICAL_H / 2 };
}

function taiLevel(levelSo) {
  const cfg = CAU_HINH_LEVEL[levelSo];
  state.level = levelSo;
  state.phase = 'setup';
  state.thoiGian = 0;
  state.soNetVe = 0;

  // reset lưới gió: level đặt lại preset, người chơi xoá trắng để vẽ lại
  taoLuoiTrong();
  for (const v of cfg.gioLevel) datGioLevel(v.x0, v.y0, v.x1, v.y1, v.huong);
  tinhLuoiChinh();

  state.buom = cfg.dsButterflyMau.map((mau) => {
    const viGoc = viTriNgauNhienTranhVung(cfg.vungHoa);
    return {
      mau, viGoc,
      vi: { ...viGoc },
      van: { x: 0, y: 0 },
      goc: Math.random() * Math.PI * 2,
      phaCanh: Math.random() * 10,
      dwellDung: 0,
      dwellSai: 0,
      trangThai: 'bay', // 'bay' | 'dau' (đã đậu) | 'bayMat' (bay khỏi vườn)
    };
  });

  document.querySelectorAll('#levelSelect button').forEach(btn => {
    btn.classList.toggle('dangChon', Number(btn.dataset.level) === levelSo);
  });
  thongBao.style.display = 'none';
  capNhatGiaoDien();
}

function hoiSinhButterflies() {
  // quay lại phase Thiết lập nhưng GIỮ NGUYÊN lưới gió đã vẽ, chỉ reset bướm
  for (const b of state.buom) {
    b.vi = { ...b.viGoc };
    b.van = { x: 0, y: 0 };
    b.dwellDung = 0; b.dwellSai = 0;
    b.trangThai = 'bay';
  }
  thongBao.style.display = 'none';
}

document.querySelectorAll('#levelSelect button').forEach(btn => {
  btn.addEventListener('click', () => taiLevel(Number(btn.dataset.level)));
});

btnDebug.addEventListener('click', () => {
  state.debug = !state.debug;
  btnDebug.classList.toggle('dangChon', state.debug);
});

btnXoa.addEventListener('click', () => {
  luoiNguoiChoi.fill(0);
  coDinhNguoiChoi.fill(0);
  state.soNetVe = 0;
  tinhLuoiChinh();
  capNhatGiaoDien();
});

btnPhase.addEventListener('click', () => {
  if (state.phase === 'setup') {
    tinhLuoiChinh();
    state.phase = 'play';
  } else {
    state.phase = 'setup';
    hoiSinhButterflies();
  }
  capNhatGiaoDien();
});

function capNhatGiaoDien() {
  const dangSetup = state.phase === 'setup';
  btnPhase.textContent = dangSetup ? '▶ Bắt đầu bay' : '↺ Vẽ lại';
  goiY.style.display = dangSetup ? 'block' : 'none';
  btnXoa.style.display = dangSetup ? 'inline-block' : 'none';
}

// ============================================================
// INPUT: dùng Pointer Events để gộp chung touch + mouse.
// Chỉ vẽ được ở phase 'setup' — nét vẽ xấp xỉ thành vector gió trên
// từng ô lưới mà nó đi qua, KHÔNG đẩy bướm trực tiếp như bản cũ.
// ============================================================
let dangVe = false;
let duongVeHienTai = [];

function toaDoTuSuKien(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) / rect.width * LOGICAL_W,
    y: (e.clientY - rect.top) / rect.height * LOGICAL_H,
  };
}

canvas.addEventListener('pointerdown', (e) => {
  if (state.phase !== 'setup') return;
  e.preventDefault();
  dangVe = true;
  duongVeHienTai = [toaDoTuSuKien(e)];
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', (e) => {
  if (!dangVe) return;
  e.preventDefault();
  duongVeHienTai.push(toaDoTuSuKien(e));
});

canvas.addEventListener('pointerup', (e) => { e.preventDefault(); ketThucNetVe(); });
canvas.addEventListener('pointercancel', () => { ketThucNetVe(); });

function ketThucNetVe() {
  if (!dangVe) return;
  dangVe = false;
  if (duongVeHienTai.length >= 3) ghiNhanNetVeVaoLuoi(duongVeHienTai);
  duongVeHienTai = [];
}

// xấp xỉ đường vẽ thành vector cho từng ô lưới nó đi qua: lấy mẫu dọc
// đường theo bước cố định, cộng dồn hướng cục bộ rồi chuẩn hoá mỗi ô.
const BUOC_LAY_MAU = 8;
function ghiNhanNetVeVaoLuoi(duong) {
  const tongTheoO = new Map();
  for (let i = 0; i < duong.length - 1; i++) {
    const a = duong[i], b2 = duong[i + 1];
    const doan = V.tru(b2, a);
    const doDaiDoan = V.doDai(doan);
    if (doDaiDoan < 1e-3) continue;
    const soBuoc = Math.max(1, Math.ceil(doDaiDoan / BUOC_LAY_MAU));
    for (let s = 0; s <= soBuoc; s++) {
      const p = V.cong(a, V.nhan(doan, s / soBuoc));
      const o = oTuViTri(p);
      if (!o) continue;
      const i2 = oIndex(o.cx, o.cy);
      const hienTai = tongTheoO.get(i2) || { x: 0, y: 0 };
      hienTai.x += doan.x; hienTai.y += doan.y;
      tongTheoO.set(i2, hienTai);
    }
  }
  for (const [i2, tong] of tongTheoO) {
    const d = Math.hypot(tong.x, tong.y);
    if (d < 1e-4) continue;
    luoiNguoiChoi[i2 * 2] = tong.x / d;
    luoiNguoiChoi[i2 * 2 + 1] = tong.y / d;
    coDinhNguoiChoi[i2] = 1;
  }
  state.soNetVe++;
  tinhLuoiChinh();
}

// ============================================================
// CẬP NHẬT VẬT LÝ MỖI FRAME
// ============================================================
function capNhat(dt) {
  state.thoiGian += dt;
  if (state.phase !== 'play') {
    // ở phase thiết lập, bướm chỉ vỗ cánh tại chỗ để có sức sống, không bay
    for (const b of state.buom) b.phaCanh += dt * 3;
    return;
  }

  const zones = CAU_HINH_LEVEL[state.level].vungHoa;

  for (const b of state.buom) {
    if (b.trangThai !== 'bay') continue;

    // vận tốc mục tiêu = hướng gió tại ô hiện tại * tốc độ bay
    const gio = gioTaiViTri(b.vi);
    const vanMucTieu = V.nhan(gio, HE_SO.tocDoBay);

    // bám dần theo vận tốc mục tiêu (mượt hoá thay vì đổi hướng tức thì)
    const nhay = 1 - Math.exp(-HE_SO.doNhayHuong * dt);
    b.van.x += (vanMucTieu.x - b.van.x) * nhay;
    b.van.y += (vanMucTieu.y - b.van.y) * nhay;
    b.vi = V.cong(b.vi, V.nhan(b.van, dt));

    // giữ bướm trong khung hình (dội nhẹ ở mép)
    if (b.vi.x < 10) { b.vi.x = 10; b.van.x *= -0.4; }
    if (b.vi.x > LOGICAL_W - 10) { b.vi.x = LOGICAL_W - 10; b.van.x *= -0.4; }
    if (b.vi.y < 10) { b.vi.y = 10; b.van.y *= -0.4; }
    if (b.vi.y > LOGICAL_H - 10) { b.vi.y = LOGICAL_H - 10; b.van.y *= -0.4; }

    if (V.doDai(b.van) > 4) b.goc = Math.atan2(b.van.y, b.van.x);
    b.phaCanh += dt * (5 + Math.min(V.doDai(b.van) / 30, 8));

    const zone = zones.find(z => Math.hypot(b.vi.x - z.x, b.vi.y - z.y) < z.r);
    if (zone && zone.mau === b.mau) {
      b.dwellDung += dt; b.dwellSai = 0;
      if (b.dwellDung >= HE_SO.thoiGianDauDung) b.trangThai = 'dau';
    } else if (zone && zone.mau !== b.mau) {
      b.dwellSai += dt; b.dwellDung = 0;
      if (b.dwellSai >= HE_SO.thoiGianBayDi) b.trangThai = 'bayMat';
    } else {
      b.dwellDung = 0; b.dwellSai = 0;
    }
  }

  kiemTraThang();
}

function kiemTraThang() {
  const tongConCanBay = state.buom.filter(b => b.trangThai === 'bay').length;
  const daDau = state.buom.filter(b => b.trangThai === 'dau').length;
  if (tongConCanBay === 0 && thongBao.style.display === 'none') {
    thongBao.textContent = daDau === state.buom.length
      ? `Hoàn thành! ${daDau}/${state.buom.length} bướm đã đậu đúng hoa 🎉`
      : `Kết thúc: ${daDau}/${state.buom.length} bướm đậu đúng hoa`;
    thongBao.style.display = 'block';
  }
}

// ============================================================
// VẼ (canvas 2D) — ưu tiên cảm giác cơ chế hơn là đẹp
// ============================================================
function ve() {
  ctx.clearRect(0, 0, LOGICAL_W, LOGICAL_H);
  ctx.fillStyle = '#f6efe0';
  ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

  veVungHoa();
  if (dangVe) veDuongVeDangKeo();
  veButterflies();
  if (state.debug) veLuoiDebug();
}

function veVungHoa() {
  for (const z of CAU_HINH_LEVEL[state.level].vungHoa) {
    const grad = ctx.createRadialGradient(z.x, z.y, 0, z.x, z.y, z.r);
    grad.addColorStop(0, MAU[z.mau] + '55');
    grad.addColorStop(1, MAU[z.mau] + '00');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(z.x, z.y, z.r, 0, Math.PI * 2);
    ctx.fill();

    ctx.setLineDash([6, 6]);
    ctx.strokeStyle = MAU[z.mau];
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(z.x, z.y, z.r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    for (let i = 0; i < 6; i++) {
      const goc = (i / 6) * Math.PI * 2;
      const r2 = z.r * 0.5;
      ctx.fillStyle = MAU[z.mau];
      ctx.beginPath();
      ctx.arc(z.x + Math.cos(goc) * r2, z.y + Math.sin(goc) * r2, 5, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function veDuongVeDangKeo() {
  if (duongVeHienTai.length < 2) return;
  ctx.strokeStyle = 'rgba(110,160,220,0.7)';
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(duongVeHienTai[0].x, duongVeHienTai[0].y);
  for (const p of duongVeHienTai) ctx.lineTo(p.x, p.y);
  ctx.stroke();
}

function veButterflies() {
  for (const b of state.buom) {
    if (b.trangThai === 'bayMat') continue;

    ctx.save();
    ctx.translate(b.vi.x, b.vi.y);
    ctx.rotate(b.goc);

    const vo = Math.sin(b.phaCanh) * 0.5 + 0.5;
    const doMoCanh = 10 + vo * 10;

    ctx.fillStyle = MAU[b.mau];
    ve1Canh(-doMoCanh, -13, 16, 10);
    ve1Canh(-doMoCanh, 13, 16, 10);
    ve1Canh(doMoCanh, -13, 16, 10);
    ve1Canh(doMoCanh, 13, 16, 10);

    ctx.fillStyle = '#4a3b2f';
    ctx.beginPath();
    ctx.ellipse(0, 0, 5, 13, 0, 0, Math.PI * 2);
    ctx.fill();

    if (b.trangThai === 'dau') {
      ctx.strokeStyle = 'rgba(255,255,255,0.8)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, 26, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }
}

function ve1Canh(x, y, rx, ry) {
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
}

// hiển thị lưới + hướng vector từng ô để debug hệ vật lý gió
function veLuoiDebug() {
  ctx.strokeStyle = 'rgba(90,70,55,0.15)';
  ctx.lineWidth = 1;
  for (let cx = 0; cx <= GRID.cols; cx++) {
    ctx.beginPath();
    ctx.moveTo(cx * GRID.canh, 0);
    ctx.lineTo(cx * GRID.canh, LOGICAL_H);
    ctx.stroke();
  }
  for (let cy = 0; cy <= GRID.rows; cy++) {
    ctx.beginPath();
    ctx.moveTo(0, cy * GRID.canh);
    ctx.lineTo(LOGICAL_W, cy * GRID.canh);
    ctx.stroke();
  }

  const nuaCanh = GRID.canh / 2;
  const doDaiMuiTen = GRID.canh * 0.4;
  for (let cy = 0; cy < GRID.rows; cy++) {
    for (let cx = 0; cx < GRID.cols; cx++) {
      const i = oIndex(cx, cy);
      const vx = luoiChinh[i * 2], vy = luoiChinh[i * 2 + 1];
      const d = Math.hypot(vx, vy);
      if (d < 0.05) continue;

      const tam = { x: cx * GRID.canh + nuaCanh, y: cy * GRID.canh + nuaCanh };
      const dau = { x: tam.x + (vx / d) * doDaiMuiTen, y: tam.y + (vy / d) * doDaiMuiTen };

      ctx.strokeStyle = coDinhNguoiChoi[i] ? 'rgba(70,150,90,0.9)'
        : coDinhLevel[i] ? 'rgba(70,110,200,0.9)'
        : 'rgba(90,70,55,0.5)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(tam.x - (vx / d) * doDaiMuiTen, tam.y - (vy / d) * doDaiMuiTen);
      ctx.lineTo(dau.x, dau.y);
      ctx.stroke();

      // đầu mũi tên nhỏ
      const gocMui = Math.atan2(vy, vx);
      ctx.beginPath();
      ctx.moveTo(dau.x, dau.y);
      ctx.lineTo(dau.x - Math.cos(gocMui - 0.5) * 6, dau.y - Math.sin(gocMui - 0.5) * 6);
      ctx.moveTo(dau.x, dau.y);
      ctx.lineTo(dau.x - Math.cos(gocMui + 0.5) * 6, dau.y - Math.sin(gocMui + 0.5) * 6);
      ctx.stroke();
    }
  }
}

function capNhatHud() {
  if (state.phase === 'setup') {
    hudTrai.textContent = `Thiết lập — Nét vẽ: ${state.soNetVe}`;
  } else {
    const daDau = state.buom.filter(b => b.trangThai === 'dau').length;
    hudTrai.textContent = `Đang bay — ${daDau} / ${state.buom.length} đã đậu`;
  }
}

// ============================================================
// VÒNG LẶP CHÍNH
// ============================================================
let thoiGianKhungHinhTruoc = performance.now();
function vongLap(now) {
  const dt = Math.min((now - thoiGianKhungHinhTruoc) / 1000, 0.033);
  thoiGianKhungHinhTruoc = now;

  capNhat(dt);
  ve();
  capNhatHud();

  requestAnimationFrame(vongLap);
}

taiLevel(1);
requestAnimationFrame(vongLap);
</script>
